<html lang="zh-CN"><head><script src="appearance.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoRefiner · Dongchen Zheng</title><link rel="stylesheet" href="style.css"></head><body><header><div class="top"><a class="brand" href="index.html"><b>DZ</b> Dongchen Zheng</a><a href="index.html#papers">← 返回主页</a><div class="prefs"><a class="lang" hreflang="en" href="georefiner.en.html">EN</a><button type="button" class="theme" aria-label="切换日光或夜间模式"><span aria-hidden="true">◐</span></button></div></div></header><main class="project-detail"><article><h1>GeoRefiner</h1><div class="resources"><a href="https://agentic-intelligence-lab.org/files/Georefiner.pdf">Paper ↗</a></div><p class="lead">Geometry-Conditioned Plug-and-Play Action Refinement for Vision-Language-Action Models</p><h2>在基础策略之后做修正</h2><p>基础 VLA 先给出一段动作。GeoRefiner 结合场景几何、指令和这段动作预测残差，用于修正轨迹。模块位于原策略下游，基础模型参数保持冻结。</p><figure class="evidence"><img loading="lazy" src="georefiner-method.webp" alt="论文图 3 · 几何、语言和动作特征进入残差细化模块。"><figcaption>论文图 3 · 几何、语言和动作特征进入残差细化模块。</figcaption></figure><h2>跨模型复用</h2><p>分阶段训练先建立几何表示，再训练细化模块，并以轻量适配连接新的基础策略。论文比较了不同骨干和环境扰动下的表现。</p></article></main></body></html>

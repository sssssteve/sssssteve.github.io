<html lang="zh-CN"><head><script src="appearance.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piper OpenPI · RTC &amp; TE · Dongchen Zheng</title><link rel="stylesheet" href="style.css"></head><body><header><div class="top"><a class="brand" href="index.html"><b>DZ</b> Dongchen Zheng</a><a href="index.html#research">← 返回主页</a><div class="prefs"><a class="lang" hreflang="en" href="piper-rtc.en.html">EN</a><button type="button" class="theme" aria-label="切换日光或夜间模式"><span aria-hidden="true">◐</span></button></div></div></header><main class="project-detail"><article><h1>Piper OpenPI · RTC &amp; TE</h1><div class="resources"><a href="https://github.com/Agentic-Intelligence-Lab/openpi-jax-rtc-te">GitHub ↗</a></div><p class="lead">开源项目</p><h2>模型算下一段时，机器人怎样动？</h2><p>JAX 服务端加载策略，Piper 客户端发送观测并执行双臂动作。相邻两次推理的计划可能在交接处不连续，这个项目实现了两种执行方式。</p><table><thead><tr><th scope="col">方式</th><th scope="col">执行逻辑</th></tr></thead><tbody><tr><td>RTC</td><td>保留上一段计划，按时间约束衔接下一段轨迹。</td></tr><tr><td>Temporal Ensemble</td><td>把同一控制时刻的重叠预测对齐后加权平均。</td></tr></tbody></table><figure class="evidence"><img loading="lazy" src="platform.webp" alt="Piper 双臂实验平台"><figcaption>Piper 双臂实验平台</figcaption></figure></article></main></body></html>

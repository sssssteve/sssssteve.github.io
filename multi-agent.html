<main class="project-detail"><article><h1>无人机多智能体集群控制</h1><div class="resources"><a href="#design">实验设计 ↓</a></div><small>本科项目 · 2024.11—2025.01</small><p class="lead">在二维栅格仿真环境中研究多架无人机怎样绕过障碍、协同规划路径。</p><h2>从专家示范到协同策略</h2><p>我参与构建动态障碍环境，以 A* 规划的路径生成专家示范，用于离线模仿预训练，再以 CNN-DQN 学习多智能体策略。</p><h2 id="design">实验怎样比较</h2><p>项目通过改变地图尺度、障碍密度、起点与目标来比较规划表现。奖励设计考虑首次访问、到目标的距离变化以及所用步数，并探索用元学习调整奖励参数。</p></article></main></body></html>
